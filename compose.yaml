services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    restart: unless-stopped
    build:
      context: apps/server
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/synthai
      FASTAPI_URL: http://api:8000
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - api

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SCALEUP_DB_PATH: ${RXN2_DB_PATH:-/workspace/data/curated/rxn2-production.sqlite}
      RXN2_DB_PATH: ${RXN2_DB_PATH:-/workspace/data/curated/rxn2-production.sqlite}
      RXN2_SEED_DEMO: ${RXN2_SEED_DEMO:-false}
      RXN2_RAW_ROOT: /raw
      RXN2_CACHE_ROOT: /workspace/data/cache
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - .:/workspace
      - "${RXN2_RAW_ROOT:-./data/raw}:/raw:ro"
      - "${RXN2_CLOUD_RESULTS_ROOT:-./data/cloud-results}:/cloud-results"
      - "${RXN2_OCR_ROOT:-./data/ocr}:/ocr:ro"

  web:
    restart: unless-stopped
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      VITE_EXPRESS_PROXY: http://server:4000
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
      server:
        condition: service_started

volumes:
  mongo-data:
