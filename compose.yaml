services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SCALEUP_DB_PATH: /workspace/data/curated/scaleup.sqlite
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
