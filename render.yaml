services:
  - type: web
    name: synthai-python-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SCALEUP_DB_PATH
        value: /workspace/data/curated/rxn2-demo.sqlite
      - key: RXN2_DB_PATH
        value: /workspace/data/curated/rxn2-demo.sqlite
      - key: RXN2_SEED_DEMO
        value: "true"
  - type: web
    name: synthai-workspace-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: ./apps/server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: synthai
      - key: JWT_SECRET
        generateValue: true
      - key: FASTAPI_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CROSS_SITE_COOKIES
        value: "true"
      - key: SYNTHAI_ALLOW_REGISTRATION
        value: "false"
